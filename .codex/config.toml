# [plugins].*.enabled below is managed by scripts/°base/ai/settings/sync.py from ai/settings/settings.json's enabledPlugins; other content here is preserved.

[plugins."openai-developers@openai-developers"]
enabled = true

# --- BEGIN generated mcp_servers (scripts/°base/ai/settings/sync.py) ---

[mcp_servers."bugsink"]
enabled = true
command = "npx"
args = ["-y", "envmcp", "--env-file", "ai/.env", "npx", "-y", "bugsink-mcp"]

[mcp_servers."bugsink".tools."get_issue"]
approval_mode = "auto"

[mcp_servers."bugsink".tools."list_issues"]
approval_mode = "auto"

[mcp_servers."bugsink".tools."list_projects"]
approval_mode = "auto"

[mcp_servers."chrome-devtools"]
enabled = false
command = "npx"
args = ["-y", "chrome-devtools-mcp@latest", "--autoConnect", "--no-usage-statistics"]

[mcp_servers."sync_todo"]
enabled = true
command = "npx"
args = ["-y", "envmcp", "--env-file", "ai/.env", "npx", "-y", "mcp-remote", "\"$SYNC_TODO_MCP_URL\"", "--header", "\"Authorization:Bearer $SYNC_TODO_MCP_TOKEN\""]

[mcp_servers."coolify"]
enabled = false
command = "npx"
args = ["-y", "envmcp", "--env-file", "ai/.env", "npx", "-y", "mcp-remote", "\"$COOLIFY_URL\"", "--header", "\"Authorization:Bearer $COOLIFY_TOKEN\""]

# --- END generated mcp_servers ---

[plugins."skill-creator@claude-plugins-official"]
enabled = true
